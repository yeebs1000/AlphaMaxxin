name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan full Git history for credentials
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  %s\n' "$archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --log-opts="--all" --redact=100 --no-banner

  compile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Syntax/import-structure check for the whole repo (legacy v1 GUI included).
      - name: Compile all Python files
        run: python -m compileall -q .

      - name: Build standalone skills from the repository
        run: python scripts/build_skills_release.py --output-dir "$RUNNER_TEMP/alphamaxx-skills"

  backend-tests:
    runs-on: ubuntu-latest
    env:
      # Offline tripwire: real providers raise instead of fetching. The v2
      # backend test suite is fully offline (fixtures + mocks) — it never
      # calls LLMs, data providers, or brokers, so it is free to run in CI.
      ALPHAMAXXIN_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: pip install -r backend/requirements-backend.txt

      - name: Run offline unit tests
        working-directory: backend
        run: python -m pytest -q

      - name: Offline boot smoke test
        run: python run.py --check

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm run build
